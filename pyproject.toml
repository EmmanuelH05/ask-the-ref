[project]
name = "atr"
version = "0.1.0"
description = "Ask the Ref: bilingual question answering over the IFAB Laws of the Game, with measured retrieval"
readme = "README.md"
authors = [
    { email = "05mannyhernandez@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.1",
    "pydantic>=2.9",
    "sentence-transformers>=3.3",
]

[project.scripts]
atr = "atr:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
